[package]
name = "grammar-watch"
version = "0.5.5"
edition = "2021"
description = "Watches a Claude Code session and reviews your English prompts in real time"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xavierforge/grammar-watch"
homepage = "https://github.com/xavierforge/grammar-watch"

[[bin]]
name = "grammar-watch"
path = "src/main.rs"

[dependencies]
# Rig 0.40 — 底層送 request 用（Anthropic provider）
# 0.40 起 crate lib 名稱從 rig 改為 rig_core，這裡用 package rename 讓程式碼仍以 `rig::` 引用
rig = { package = "rig-core", version = "0.40" }
# 非同步 runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# 檔案系統事件監看（inotify / FSEvents 的跨平台包裝）
notify = "6"
# JSONL 每行的解析
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI 參數
clap = { version = "4", features = ["derive"] }
# 終端機顏色
owo-colors = "4"
# 自製選單（select.rs）的按鍵讀取與畫面控制
crossterm = "0.28"
# 選單文字依「顯示寬度」截斷（CJK 一字兩格），避免折行弄壞重繪
unicode-width = "0.2"
# 錯誤處理
anyhow = "1"
# 設定檔解析（~/.config/grammar-watch/config.toml）
toml = "0.8"
# 講評日誌的時間戳（只要本地時間，不用完整功能）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 算出原句與建議句的差異，逐字標記改了哪裡
similar = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
